<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renderizador GFM com colunas</title>
      <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
        }

        .gfm-columns {
            display: flex;
            gap: 5px;
            margin: 5px 0;
        }

        .gfm-col {
            flex: 0 1 auto;
            min-width: 0;
        }

        /* Versão com equalização de altura (f[]) */
        .gfm-columns-f {
            align-items: stretch;
        }

        .gfm-columns-f .gfm-col {
            display: flex;
            flex-direction: column;
        }

        .gfm-columns-f .gfm-col > * {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .gfm-columns-f .gfm-col img {
            height: 100%;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            display: block;
        }
    
        /* Ajuste para outros elementos (vídeos, iframes) */
        .gfm-columns-f .gfm-col video,
        .gfm-columns-f .gfm-col iframe {
            max-height: 100%;
            width: auto;
        }

        /* Opcional: fundo para visualização */
        .gfm-col {
            padding: 4px;
            background: #f9f9f9;
            border-radius: 4px;
        }
    </style>
    <!-- Biblioteca marked para parse de Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="content">Carregando README.md...</div>

    <script>
        (async function() {
            try {
                // Busca o arquivo README.md no mesmo diretório
                const response = await fetch('README.md');
                if (!response.ok) throw new Error('README.md não encontrado');
                const markdown = await response.text();

                // Processa o markdown com a sintaxe especial
                const html = await renderMarkdownWithColumns(markdown);
                document.getElementById('content').innerHTML = html;
            } catch (error) {
                document.getElementById('content').innerHTML = `<p style="color:red">Erro: ${error.message}</p>`;
            }
        })();

        /**
         * Função principal: substitui a sintaxe [x]||[y] e f[x]||[y] por colunas HTML.
         * @param {string} markdown - Texto original do README.md
         * @returns {Promise<string>} HTML final renderizado
         */
        async function renderMarkdownWithColumns(markdown) {
            // Regex para capturar os blocos: 
            // Grupo 1: 'f' opcional
            // Grupo 2: conteúdo do primeiro bloco (entre [ e ])
            // Grupo 3: conteúdo do segundo bloco (entre [ e ])
            const regex = /(f?)\[\s*([\s\S]*?)\s*\]\|\|\s*\[\s*([\s\S]*?)\s*\]/g;

            const matches = [];
            let match;
            let placeholderIndex = 0;

            // Primeiro, coletamos todos os matches e geramos placeholders
            let textWithPlaceholders = markdown.replace(regex, (fullMatch, fFlag, leftContent, rightContent) => {
                const placeholder = `@@@PLACEHOLDER_${placeholderIndex++}@@@`;
                matches.push({
                    placeholder,
                    left: leftContent,
                    right: rightContent,
                    f: fFlag === 'f'
                });
                return placeholder;
            });

            // Converte o markdown restante (com placeholders) para HTML
            let htmlWithPlaceholders = await marked.parse(textWithPlaceholders);

            // Agora processamos cada match: converte left/right para HTML e substitui o placeholder
            for (const item of matches) {
                // Converte os conteúdos dos blocos (cada um pode ter markdown)
                const leftHtml = await marked.parse(item.left);
                const rightHtml = await marked.parse(item.right);

                // Cria o HTML das colunas
                const columnsClass = item.f ? 'gfm-columns gfm-columns-f' : 'gfm-columns';
                const columnsHtml = `
                    <div class="${columnsClass}">
                        <div class="gfm-col">${leftHtml}</div>
                        <div class="gfm-col">${rightHtml}</div>
                    </div>
                `;

                // Substitui o placeholder no HTML final
                htmlWithPlaceholders = htmlWithPlaceholders.replace(item.placeholder, columnsHtml);
            }

            return htmlWithPlaceholders;
        }
    </script>
</body>
</html>
