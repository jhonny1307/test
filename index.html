<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>GFM Renderer</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 40px;
    background: #0f1115;
    color: #e6edf3;
  }

  .markdown-body {
    max-width: 900px;
    margin: auto;
    line-height: 1.6;
  }

  /* === side-by-side === */
  .md-row {
    display: flex;
    gap: 5px;
    margin: 5px 0;
    align-items: flex-start;
  }

  .md-cell {
    flex: 1;
    min-width: 0;
  }

  .md-fit {
    display: flex;
    align-items: stretch;
  }

  .md-fit > * {
    height: 100%;
    width: auto;
    object-fit: contain;
  }

  img {
    max-width: 100%;
  }

  pre {
    overflow: auto;
    padding: 12px;
    background: #161b22;
    border-radius: 8px;
  }

  code {
    background: #161b22;
    padding: 2px 6px;
    border-radius: 6px;
  }
</style>
</head>
<body>

<div id="app" class="markdown-body">Carregando…</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
// =============================
// CONFIG
// =============================
const GAP = 5;

// =============================
// UTIL: bloqueia títulos
// =============================
function stripHeadings(md) {
  return md.replace(/^#{1,6}\s.+$/gm, '');
}

// =============================
// PARSER CUSTOM
// =============================
function parseSideBySide(md) {
  const regex = /^(\s*)(f)?\[\s*([\s\S]*?)\s*\]\s*\|\|\s*\[\s*([\s\S]*?)\s*\]\s*$/gm;

  return md.replace(regex, (_, indent, fitFlag, left, right) => {
    left = stripHeadings(left);
    right = stripHeadings(right);

    const leftHTML = marked.parse(left);
    const rightHTML = marked.parse(right);

    const fitClass = fitFlag ? 'md-fit' : '';

    return `
<div class="md-row">
  <div class="md-cell ${fitClass}">
    ${leftHTML}
  </div>
  <div class="md-cell">
    ${rightHTML}
  </div>
</div>
`;
  });
}

// =============================
// LOAD README
// =============================
async function load() {
  try {
    const res = await fetch('./README.md');
    let md = await res.text();

    md = parseSideBySide(md);

    const html = marked.parse(md);

    document.getElementById('app').innerHTML = html;

    applyFitLogic();

  } catch (e) {
    document.getElementById('app').textContent =
      'Erro carregando README.md';
    console.error(e);
  }
}

// =============================
// FIT HEIGHT (o pulo do gato)
// =============================
function applyFitLogic() {
  document.querySelectorAll('.md-row').forEach(row => {
    const fitCell = row.querySelector('.md-fit');
    if (!fitCell) return;

    const cells = row.querySelectorAll('.md-cell');
    const left = cells[0];
    const right = cells[1];

    const resize = () => {
      const h = right.offsetHeight;
      fitCell.style.height = h + 'px';
    };

    resize();
    window.addEventListener('resize', resize);
  });
}

load();
</script>

</body>
</html>
